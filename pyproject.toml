[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traceoffload"
version = "0.1.0"
description = "Trace-aware LLM-to-SLM offloading for stateful agents"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
  "PyYAML>=6.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
# 离线链路（router/）：训练与阈值挑选
router = ["scikit-learn>=1.4"]
# JEV native System One client; imported lazily so the disabled path stays light.
jev = ["httpx>=0.27"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["traceoffload*", "router*", "experiments*"]
